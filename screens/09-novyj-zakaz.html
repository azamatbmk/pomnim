<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#344b3d">
  <title>Помним — новый заказ</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23344b3d'/%3E%3Cpath d='M19 45V28a13 13 0 0 1 26 0v17M27 45V30a5 5 0 0 1 10 0v15' fill='none' stroke='%23eee9db' stroke-width='3'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #f7f7f2;
      --paper: #fff;
      --ink: #283a32;
      --muted: #737d75;
      --green: #344f40;
      --line: #e2e6dd;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #e7eee4; color: var(--ink); font-family: Arial, "Helvetica Neue", sans-serif; font-size: 14px; line-height: 1.55; }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    button, a, input, textarea { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid #b38454; outline-offset: 3px; }
    .stage { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 28px 16px; }
    .stage-label { margin: 0; font-size: 11px; letter-spacing: 1.4px; text-transform: uppercase; color: #77856d; }
    .phone { width: 390px; height: 844px; max-height: calc(100dvh - 88px); background: var(--bg); border: 1px solid var(--line); border-radius: 36px; box-shadow: 0 20px 80px #102f2433; overflow: hidden; display: flex; flex-direction: column; }
    .top { padding: 22px 22px 0; }
    .back { display: inline-flex; align-items: center; gap: 8px; color: var(--green); font-size: 12px; }
    .back svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .screen { flex: 1; min-height: 0; overflow: auto; padding: 16px 22px 12px; scrollbar-width: none; }
    .screen::-webkit-scrollbar { display: none; }
    h1 { margin: 16px 0 6px; font-family: Georgia, "Times New Roman", serif; font-size: 30px; font-weight: 400; letter-spacing: -0.7px; line-height: 1.2; }
    .lead, .help { margin: 0; font-size: 12px; line-height: 1.55; color: #8b9482; }
    .lead { margin-bottom: 16px; color: #6d7867; font-size: 13px; }
    .choice { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left; margin-bottom: 8px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); color: inherit; }
    .choice[aria-pressed="true"] { border-color: #859c78; background: #f3f6ed; }
    .choice strong { display: block; font-size: 13px; font-weight: 500; }
    .choice small { display: block; margin-top: 2px; font-size: 11px; color: var(--muted); }
    .mark { width: 18px; height: 18px; border: 1.5px solid #c5d0b5; border-radius: 50%; flex-shrink: 0; }
    .choice[aria-pressed="true"] .mark { background: var(--green); border-color: var(--green); box-shadow: inset 0 0 0 3px #f3f6ed; }
    label { display: block; margin: 14px 0 6px; font-size: 12px; font-weight: 500; }
    input, textarea { width: 100%; padding: 12px; border: 1px solid #dce2d4; border-radius: 8px; background: #fff; color: var(--ink); font-size: 16px; }
    textarea { min-height: 80px; resize: vertical; }
    input:focus, textarea:focus { border-color: #859c78; outline: none; }
    #other-box[hidden] { display: none; }
    .dock { padding: 12px 22px 18px; background: #fafbf7; border-top: 1px solid var(--line); }
    .btn { width: 100%; border: 0; border-radius: 8px; padding: 13px 18px; background: var(--green); color: #fff; font-size: 13px; font-weight: 500; }
    .btn:hover { background: #233d2f; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn:disabled:hover { background: var(--green); }
    @media (max-width: 480px) {
      body { background: var(--bg); }
      .stage { padding: 0; gap: 0; }
      .stage-label { display: none; }
      .phone { width: 100%; height: 100dvh; max-height: none; border: 0; border-radius: 0; box-shadow: none; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <p class="stage-label">Экран 9 · Новый заказ</p>
    <div class="phone">
      <div class="top">
        <a class="back" id="back" href="05-mogila.html?id=zarina">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H4m6-6-6 6 6 6"/></svg>
          Карточка
        </a>
      </div>
      <form class="screen" id="order-form">
        <h1 id="who">Хугаева Зарина Сослановна</h1>
        <p class="lead">Выберите работы и дату. Цену назовёт исполнитель.</p>
        <button class="choice" type="button" data-service="clean" aria-pressed="false"><span><strong>Уборка участка</strong><small>Листва, сорняки, мусор</small></span><span class="mark"></span></button>
        <button class="choice" type="button" data-service="paint" aria-pressed="false"><span><strong>Покраска ограды</strong><small>Цвет и материал напишите ниже</small></span><span class="mark"></span></button>
        <button class="choice" type="button" data-service="flowers" aria-pressed="false"><span><strong>Возложение цветов</strong><small>Какие цветы — в пожеланиях</small></span><span class="mark"></span></button>
        <button class="choice" type="button" data-service="visit" aria-pressed="false"><span><strong>Осмотр и фото</strong><small>Если снимка могилы ещё нет</small></span><span class="mark"></span></button>
        <button class="choice" type="button" data-service="other" aria-pressed="false"><span><strong>Другое</strong><small>Опишите фронт работ</small></span><span class="mark"></span></button>
        <div id="other-box" hidden>
          <label for="other">Что нужно сделать</label>
          <textarea id="other" maxlength="800" placeholder="Опишите работы своими словами"></textarea>
        </div>
        <label for="date">Желаемая дата</label>
        <input id="date" type="date" required>
        <p class="help">Исполнитель подтвердит, что успеет.</p>
        <label for="notes">Пожелания к этой работе</label>
        <textarea id="notes" maxlength="800" placeholder="Какие цветы, цвет ограды, что убрать"></textarea>
        <p class="help" id="touch">На карточке уже есть: не трогать кусты у ограды и лампаду.</p>
      </form>
      <div class="dock">
        <button class="btn" id="send" type="submit" form="order-form" disabled>Отправить заявку</button>
      </div>
    </div>
  </div>
  <script>
    const graves = {
      zarina: { name: 'Хугаева Зарина Сослановна', touch: 'не трогать кусты у ограды и лампаду' },
      soslan: { name: 'Хугаев Сослан Батрович', touch: 'ограду не красить без согласования цвета' }
    };
    const id = new URLSearchParams(location.search).get('id');
    const grave = graves[id] || graves.zarina;
    const graveId = graves[id] ? id : 'zarina';
    document.getElementById('who').textContent = grave.name;
    document.getElementById('touch').textContent = 'На карточке уже есть: ' + grave.touch + '.';
    document.getElementById('back').href = '05-mogila.html?id=' + graveId;
    document.getElementById('date').min = new Date().toISOString().slice(0, 10);

    const choices = [...document.querySelectorAll('.choice')];
    const otherBox = document.getElementById('other-box');
    const other = document.getElementById('other');
    const date = document.getElementById('date');
    const send = document.getElementById('send');

    function refresh() {
      const picked = choices.filter((item) => item.getAttribute('aria-pressed') === 'true');
      const otherOn = picked.some((item) => item.dataset.service === 'other');
      otherBox.hidden = !otherOn;
      const otherOk = !otherOn || other.value.trim().length > 0;
      send.disabled = picked.length === 0 || !date.value || !otherOk;
    }

    choices.forEach((item) => {
      item.addEventListener('click', () => {
        item.setAttribute('aria-pressed', item.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
        refresh();
      });
    });
    other.addEventListener('input', refresh);
    date.addEventListener('input', refresh);
    document.getElementById('order-form').addEventListener('submit', (event) => {
      event.preventDefault();
      if (send.disabled) return;
      const labels = {
        clean: 'Уборка участка',
        paint: 'Покраска ограды',
        flowers: 'Возложение цветов',
        visit: 'Осмотр и фото',
        other: 'Другое'
      };
      const services = choices
        .filter((item) => item.getAttribute('aria-pressed') === 'true')
        .map((item) => labels[item.dataset.service]);
      sessionStorage.setItem('pomnim-draft', JSON.stringify({
        id: graveId,
        name: grave.name,
        services,
        other: other.value.trim(),
        date: date.value,
        notes: document.getElementById('notes').value.trim(),
        touch: grave.touch
      }));
      location.href = '08-zakaz.html?id=' + graveId + '&fresh=1';
    });
  </script>
</body>
</html>

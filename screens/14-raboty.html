<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#344b3d">
  <title>Помним — заявки исполнителя</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23344b3d'/%3E%3Cpath d='M19 45V28a13 13 0 0 1 26 0v17M27 45V30a5 5 0 0 1 10 0v15' fill='none' stroke='%23eee9db' stroke-width='3'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #f7f7f2;
      --paper: #fff;
      --ink: #283a32;
      --muted: #737d75;
      --green: #344f40;
      --line: #e2e6dd;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #e7eee4; color: var(--ink); font-family: Arial, "Helvetica Neue", sans-serif; font-size: 14px; line-height: 1.55; }
    button { font: inherit; cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, a:focus-visible { outline: 3px solid #b38454; outline-offset: 3px; }
    .stage { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 28px 16px; }
    .stage-label { margin: 0; font-size: 11px; letter-spacing: 1.4px; text-transform: uppercase; color: #77856d; }
    .phone { width: 390px; height: 844px; max-height: calc(100dvh - 88px); background: var(--bg); border: 1px solid var(--line); border-radius: 36px; box-shadow: 0 20px 80px #102f2433; overflow: hidden; display: flex; flex-direction: column; }
    .top { display: flex; align-items: center; justify-content: space-between; padding: 26px 22px 0; }
    .brand { display: flex; gap: 10px; align-items: center; font-family: Georgia, "Times New Roman", serif; font-size: 26px; letter-spacing: -1.2px; line-height: 1; }
    .brand-symbol { width: 24px; height: 28px; border: 2px solid #5b715e; border-bottom: 0; border-radius: 16px 16px 0 0; display: flex; justify-content: center; align-items: flex-end; }
    .brand-symbol svg { display: block; width: 6px; height: 18px; }
    .who { text-align: right; }
    .who strong { display: block; font-family: Georgia, "Times New Roman", serif; font-size: 16px; font-weight: 400; }
    .who span { font-size: 10px; color: #637b55; }
    .screen { flex: 1; min-height: 0; overflow: auto; padding: 18px 22px 18px; scrollbar-width: none; }
    .screen::-webkit-scrollbar { display: none; }
    h1 { margin: 0 0 6px; font-family: Georgia, "Times New Roman", serif; font-size: 32px; font-weight: 400; letter-spacing: -0.8px; line-height: 1.15; }
    .lead { margin: 0 0 16px; font-size: 13px; line-height: 1.6; color: #6d7867; }
    .list { display: grid; gap: 10px; }
    .order { width: 100%; text-align: left; padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--paper); color: inherit; }
    .status { display: inline-flex; padding: 4px 8px; border-radius: 20px; background: #f6eee1; color: #967a47; font-size: 10px; }
    .status.sent { background: #edf1e8; color: #637b55; }
    .status.agreed { background: #eef2e7; color: #344f40; }
    .status.revision { background: #edeefa; color: #77709b; }
    .order strong { display: block; margin-top: 8px; font-family: Georgia, "Times New Roman", serif; font-size: 18px; font-weight: 400; line-height: 1.25; }
    .order small { display: block; margin-top: 4px; font-size: 12px; color: var(--muted); line-height: 1.45; }
    @media (max-width: 480px) {
      body { background: var(--bg); }
      .stage { padding: 0; gap: 0; }
      .stage-label { display: none; }
      .phone { width: 100%; height: 100dvh; max-height: none; border: 0; border-radius: 0; box-shadow: none; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <p class="stage-label">Экран 14 · Заявки исполнителя</p>
    <div class="phone">
      <div class="top">
        <div class="brand">
          <span class="brand-symbol" aria-hidden="true"><svg viewBox="10 7.6 7.4 24.6"><path d="M13.6 7.8C15.1 9.5 16.5 11.8 16.9 13.6 17.25 15 16.8 16.1 15.9 16.5 15.2 16.8 14.6 16.55 14.2 16.15 13.85 15.8 13.7 15.2 13.9 14.75 13.5 15.3 13.05 16.2 12.75 17.05 12.1 16.2 11.2 14.8 11.35 13.2 11.5 11.4 12.3 9.2 13.6 7.8Z" fill="#5b715e"/><path d="M12.85 16.95H13.2L13.05 18.5H12.7Z" fill="#5b715e"/><path d="M10.55 31.35Q10.55 32 11.35 32H15Q15.8 32 15.8 31.35V19.45C15.8 19.05 16.2 18.65 16.1 18.25 15.95 17.85 15.4 17.75 15.1 18.1 14.8 18.45 14.45 18.7 14.1 18.3 13.75 17.9 13.45 17.7 13.1 18.05 12.75 17.7 12.4 17.95 12.05 18.4 11.7 18.85 11.3 18.5 11 18.1 10.65 17.7 10.05 17.95 10.05 18.4 10.05 18.85 10.5 19.1 10.55 19.45V31.35Z" fill="#5b715e"/></svg></span>
          <span>помним</span>
        </div>
        <div class="who"><strong>Марат</strong><span>Исполнитель</span></div>
      </div>
      <main class="screen">
        <h1>Заявки</h1>
        <p class="lead">Новая заявка отдельно. Согласованная работа, где нужны снимки, отдельно.</p>
        <div class="list" id="list"></div>
      </main>
    </div>
  </div>
  <script>
    function readStore(key) {
      try {
        const value = JSON.parse(sessionStorage.getItem(key) || 'null');
        if (!value || typeof value !== 'object') return {};
        return value;
      } catch (error) {
        return {};
      }
    }

    const params = new URLSearchParams(location.search);
    const offer = readStore('pomnim-offer');
    const revision = readStore('pomnim-revision');
    const photos = readStore('pomnim-photos');
    const offerSent = params.get('sent') === '1' || Boolean(offer.amount);
    const rows = [{
      tone: offerSent ? 'sent' : '',
      status: offerSent ? 'Предложение отправлено' : 'Новая заявка',
      name: 'Хугаева Зарина Сослановна',
      detail: '15 ноября 2026 · уборка и цветы',
      href: offerSent ? '10-ispolnitel.html?sent=1' : '10-ispolnitel.html'
    }];

    let soslan = {
      tone: 'agreed',
      status: 'Нужны снимки',
      name: 'Хугаев Сослан Батрович',
      detail: 'Городское кладбище · осмотр и фото',
      href: '12-foto.html?id=soslan'
    };
    if (photos.soslan) {
      soslan = Object.assign(soslan, { tone: 'sent', status: 'Фотоотчёт отправлен' });
    } else if (revision.id === 'soslan' && revision.text) {
      soslan = Object.assign(soslan, {
        tone: 'revision',
        status: 'На доработке',
        detail: revision.text,
        href: '12-foto.html?id=soslan&revision=1'
      });
    }
    rows.push(soslan);

    if (revision.id === 'zarina' && revision.text && !photos.zarina) {
      rows.push({
        tone: 'revision',
        status: 'На доработке',
        name: 'Хугаева Зарина Сослановна',
        detail: revision.text,
        href: '12-foto.html?id=zarina&revision=1'
      });
    }

    const list = document.getElementById('list');
    rows.forEach((item) => {
      const row = document.createElement('button');
      row.className = 'order';
      row.type = 'button';
      row.innerHTML = '<span class="status"></span><strong></strong><small></small>';
      const pill = row.querySelector('.status');
      pill.textContent = item.status;
      if (item.tone) pill.classList.add(item.tone);
      row.querySelector('strong').textContent = item.name;
      row.querySelector('small').textContent = item.detail;
      row.addEventListener('click', () => { location.href = item.href; });
      list.appendChild(row);
    });
  </script>
</body>
</html>

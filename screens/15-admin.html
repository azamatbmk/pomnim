<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#344b3d">
  <title>Помним — админка</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23344b3d'/%3E%3Cpath d='M19 45V28a13 13 0 0 1 26 0v17M27 45V30a5 5 0 0 1 10 0v15' fill='none' stroke='%23eee9db' stroke-width='3'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #f7f7f2;
      --paper: #fff;
      --ink: #283a32;
      --muted: #737d75;
      --green: #344f40;
      --line: #e2e6dd;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #e7eee4; color: var(--ink); font-family: Arial, "Helvetica Neue", sans-serif; font-size: 14px; line-height: 1.55; }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    button, input, textarea { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid #b38454; outline-offset: 3px; }
    .stage { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 28px 16px; }
    .stage-label { margin: 0; font-size: 11px; letter-spacing: 1.4px; text-transform: uppercase; color: #77856d; }
    .window { width: min(980px, 100%); background: var(--bg); border: 1px solid var(--line); border-radius: 28px; box-shadow: 0 20px 80px #102f2433; overflow: hidden; }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 22px 28px; background: #fafbf7; border-bottom: 1px solid var(--line); }
    .brand { display: flex; gap: 12px; align-items: center; }
    .brand-symbol { width: 26px; height: 32px; border: 2px solid #5b715e; border-bottom: 0; border-radius: 16px 16px 0 0; display: flex; justify-content: center; align-items: flex-end; }
    .brand .brand-symbol { display: flex; }
    .brand-symbol svg { display: block; width: 6px; height: 20px; }
    .brand strong { display: block; font-family: Georgia, "Times New Roman", serif; font-size: 26px; font-weight: 400; letter-spacing: -1.2px; line-height: 1; }
    .brand span { display: block; margin-top: 3px; font-size: 11px; color: #77856d; }
    .quiet { border: 0; background: transparent; color: var(--green); font-size: 13px; padding: 8px 0; }
    .body { display: grid; grid-template-columns: 1.4fr 0.8fr; gap: 22px; padding: 28px; }
    h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: 32px; font-weight: 400; letter-spacing: -0.8px; line-height: 1.15; }
    .lead, .help { margin: 8px 0 0; font-size: 13px; line-height: 1.55; color: #6d7867; }
    .person { margin-top: 16px; padding: 16px 18px; background: var(--paper); border: 1px solid var(--line); border-radius: 16px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .person h2 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: 22px; font-weight: 400; }
    .person p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
    .off { border: 0; background: transparent; color: #895942; font-size: 12px; padding: 8px; white-space: nowrap; }
    .panel { padding: 18px; background: var(--paper); border: 1px solid var(--line); border-radius: 16px; }
    .panel h2 { margin: 0 0 4px; font-family: Georgia, "Times New Roman", serif; font-size: 22px; font-weight: 400; }
    label { display: block; margin: 14px 0 6px; font-size: 12px; font-weight: 500; }
    input, textarea { width: 100%; padding: 12px; border: 1px solid #dce2d4; border-radius: 8px; background: #fff; color: var(--ink); font-size: 16px; }
    textarea { min-height: 74px; resize: vertical; }
    input:focus, textarea:focus { border-color: #859c78; outline: none; }
    .btn { width: 100%; margin-top: 16px; border: 0; border-radius: 8px; padding: 13px 18px; background: var(--green); color: #fff; font-size: 13px; font-weight: 500; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    @media (max-width: 800px) {
      .body { grid-template-columns: 1fr; padding: 22px; }
      .top { padding: 18px 22px; }
    }
    @media (max-width: 480px) {
      body { background: var(--bg); }
      .stage { padding: 0; gap: 0; }
      .stage-label { display: none; }
      .window { border: 0; border-radius: 0; box-shadow: none; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <p class="stage-label">Экран 15 · Админка</p>
    <div class="window">
      <header class="top">
        <div class="brand">
          <span class="brand-symbol" aria-hidden="true"><svg viewBox="10 7.6 7.4 24.6"><path d="M13.6 7.8C15.1 9.5 16.5 11.8 16.9 13.6 17.25 15 16.8 16.1 15.9 16.5 15.2 16.8 14.6 16.55 14.2 16.15 13.85 15.8 13.7 15.2 13.9 14.75 13.5 15.3 13.05 16.2 12.75 17.05 12.1 16.2 11.2 14.8 11.35 13.2 11.5 11.4 12.3 9.2 13.6 7.8Z" fill="#5b715e"/><path d="M12.85 16.95H13.2L13.05 18.5H12.7Z" fill="#5b715e"/><path d="M10.55 31.35Q10.55 32 11.35 32H15Q15.8 32 15.8 31.35V19.45C15.8 19.05 16.2 18.65 16.1 18.25 15.95 17.85 15.4 17.75 15.1 18.1 14.8 18.45 14.45 18.7 14.1 18.3 13.75 17.9 13.45 17.7 13.1 18.05 12.75 17.7 12.4 17.95 12.05 18.4 11.7 18.85 11.3 18.5 11 18.1 10.65 17.7 10.05 17.95 10.05 18.4 10.05 18.85 10.5 19.1 10.55 19.45V31.35Z" fill="#5b715e"/></svg></span>
          <div>
            <strong>помним</strong>
            <span>Админка владельца</span>
          </div>
        </div>
        <button class="quiet" type="button">Выйти</button>
      </header>
      <div class="body">
        <section>
          <h1>Исполнители</h1>
          <p class="lead">Людей сюда добавляете вы. Сами они зарегистрироваться не могут.</p>
          <article class="person">
            <div>
              <h2>Марат</h2>
              <p>+7 918 200-30-40</p>
              <p>Владикавказ · Городское кладбище</p>
            </div>
            <button class="off" type="button">Отключить</button>
          </article>
        </section>
        <form class="panel" id="worker-form">
          <h2>Новый исполнитель</h2>
          <p class="help">Имени и телефона достаточно, чтобы пустить человека в приложение.</p>
          <label for="name">Имя</label>
          <input id="name" maxlength="80" required placeholder="Как его увидит заказчик">
          <label for="phone">Телефон</label>
          <input id="phone" type="tel" inputmode="tel" required placeholder="+7 900 000-00-00">
          <label for="area">Где берёт работу</label>
          <textarea id="area" maxlength="200" required placeholder="Город и кладбище"></textarea>
          <button class="btn" id="add" type="submit" disabled>Добавить</button>
        </form>
      </div>
    </div>
  </div>
  <script>
    const name = document.getElementById('name');
    const phone = document.getElementById('phone');
    const area = document.getElementById('area');
    const add = document.getElementById('add');
    function refresh() {
      const digits = phone.value.replace(/\D/g, '');
      add.disabled = !name.value.trim() || digits.length < 11 || !area.value.trim();
    }
    [name, phone, area].forEach((field) => field.addEventListener('input', refresh));
    document.getElementById('worker-form').addEventListener('submit', (event) => {
      event.preventDefault();
    });
  </script>
</body>
</html>

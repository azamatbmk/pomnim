<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#344b3d">
  <title>Помним — новая могила</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23344b3d'/%3E%3Cpath d='M19 45V28a13 13 0 0 1 26 0v17M27 45V30a5 5 0 0 1 10 0v15' fill='none' stroke='%23eee9db' stroke-width='3'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #f7f7f2;
      --paper: #fff;
      --ink: #283a32;
      --muted: #737d75;
      --green: #344f40;
      --line: #e2e6dd;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #e7eee4;
      color: var(--ink);
      font-family: Arial, "Helvetica Neue", sans-serif;
      font-size: 14px;
      line-height: 1.55;
    }

    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    button, a, input, select, textarea { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 3px solid #b38454;
      outline-offset: 3px;
    }

    .stage {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 28px 16px;
    }

    .stage-label {
      margin: 0;
      font-size: 11px;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: #77856d;
    }

    .phone {
      width: 390px;
      height: 844px;
      max-height: calc(100dvh - 88px);
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 36px;
      box-shadow: 0 20px 80px #102f2433;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .top { padding: 22px 22px 0; }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--green);
      font-size: 12px;
    }

    .back svg, .map svg, .upload svg {
      width: 15px;
      height: 15px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .screen {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 16px 22px 12px;
      scrollbar-width: none;
    }

    .screen::-webkit-scrollbar { display: none; }

    h1 {
      margin: 16px 0 6px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 32px;
      font-weight: 400;
      letter-spacing: -0.8px;
      line-height: 1.15;
    }

    .lead {
      margin: 0 0 8px;
      font-size: 13px;
      line-height: 1.6;
      color: #6d7867;
    }

    .group {
      margin: 18px 0 10px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #77856d;
    }

    label {
      display: block;
      margin: 12px 0 6px;
      font-size: 12px;
      font-weight: 500;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #dce2d4;
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font-size: 16px;
    }

    textarea { min-height: 72px; resize: vertical; }
    input::placeholder, textarea::placeholder { color: #a1a896; }
    input:focus, select:focus, textarea:focus { border-color: #859c78; outline: none; }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .help {
      margin: 8px 0 0;
      font-size: 11px;
      line-height: 1.55;
      color: #8b9482;
    }

    .uploads {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .upload, .map {
      border: 1px dashed #bdc6b4;
      background: #fafbf7;
      color: #6c786e;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-align: center;
    }

    .upload { height: 92px; padding: 10px; font-size: 12px; }
    .map {
      width: 100%;
      min-height: 74px;
      margin-top: 12px;
      padding: 16px;
      flex-direction: row;
      font-size: 13px;
    }

    .map.set {
      border-style: solid;
      border-color: #859c78;
      background: #eef2e7;
      color: var(--green);
    }

    #family-name[hidden] { display: none; }

    .dock {
      padding: 12px 22px 18px;
      background: #fafbf7;
      border-top: 1px solid var(--line);
    }

    .btn {
      width: 100%;
      border: 0;
      border-radius: 8px;
      padding: 13px 18px;
      background: var(--green);
      color: #fff;
      font-size: 13px;
      font-weight: 500;
    }

    .btn:hover { background: #233d2f; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn:disabled:hover { background: var(--green); }

    @media (max-width: 480px) {
      body { background: var(--bg); }
      .stage { padding: 0; gap: 0; }
      .stage-label { display: none; }
      .phone {
        width: 100%;
        height: 100dvh;
        max-height: none;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <div class="stage">
    <p class="stage-label">Экран 6 · Новая могила</p>
    <div class="phone">
      <div class="top">
        <a class="back" id="back" href="04-mogily.html">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H4m6-6-6 6 6 6"/></svg>
          <span id="back-label">Могилы</span>
        </a>
      </div>
      <form class="screen" id="grave-form">
        <h1 id="title">Новая могила</h1>
        <p class="lead" id="lead">Кто этот человек и как найти участок. Остальное можно добавить потом.</p>

        <h2 class="group">Человек</h2>
        <label for="fio">Фамилия, имя, отчество</label>
        <input id="fio" name="fio" required maxlength="120" placeholder="Хугаева Зарина Сослановна" autocomplete="name">
        <div class="row">
          <div>
            <label for="birth">Год рождения</label>
            <input id="birth" name="birth" inputmode="numeric" maxlength="4" placeholder="1942">
          </div>
          <div>
            <label for="death">Год смерти</label>
            <input id="death" name="death" inputmode="numeric" maxlength="4" placeholder="2019">
          </div>
        </div>
        <p class="help">Достаточно года. День и месяц можно не указывать.</p>
        <div class="uploads">
          <button class="upload" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V6m0 0-4 4m4-4 4 4"/><path d="M5 18h14"/></svg>
            Фото человека
          </button>
          <button class="upload" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V6m0 0-4 4m4-4 4 4"/><path d="M5 18h14"/></svg>
            Фото могилы
          </button>
        </div>
        <p class="help">Необязательно. Фото человека исполнитель не увидит.</p>

        <h2 class="group">Место</h2>
        <label for="city">Населённый пункт</label>
        <input id="city" name="city" required maxlength="80" placeholder="Владикавказ">
        <label for="cemetery">Кладбище</label>
        <input id="cemetery" name="cemetery" required maxlength="150" placeholder="Название или где находится">
        <button class="map" id="map" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 0 1 14 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>
          <span id="map-label">Поставить точку на карте</span>
        </button>
        <label for="marks">Ориентиры</label>
        <textarea id="marks" name="marks" maxlength="400" placeholder="Аллея, ряд, ограда, вход"></textarea>

        <h2 class="group">Семья</h2>
        <label for="family">Связать с другой могилой</label>
        <select id="family" name="family">
          <option value="none">Не связывать</option>
          <option value="hugaevy">Семья Хугаевых</option>
          <option value="new">Новая семья</option>
        </select>
        <div id="family-name" hidden>
          <label for="family-title">Название семьи</label>
          <input id="family-title" name="family-title" maxlength="80" placeholder="Семья Хугаевых">
        </div>

        <h2 class="group">Если хотите</h2>
        <label for="life">Кем был при жизни</label>
        <textarea id="life" name="life" maxlength="500" placeholder="Необязательно"></textarea>
        <label for="keep">Что нельзя трогать</label>
        <textarea id="keep" name="keep" maxlength="400" placeholder="Посадки, ограда, лампада"></textarea>
      </form>
      <div class="dock">
        <button class="btn" id="save" type="submit" form="grave-form" disabled>Сохранить</button>
      </div>
    </div>
  </div>
  <script>
    const fio = document.getElementById('fio');
    const city = document.getElementById('city');
    const cemetery = document.getElementById('cemetery');
    const save = document.getElementById('save');
    const family = document.getElementById('family');
    const familyName = document.getElementById('family-name');
    const map = document.getElementById('map');
    const mapLabel = document.getElementById('map-label');

    function refresh() {
      save.disabled = !fio.value.trim() || !city.value.trim() || !cemetery.value.trim();
    }

    [fio, city, cemetery].forEach((field) => field.addEventListener('input', refresh));

    family.addEventListener('change', () => {
      familyName.hidden = family.value !== 'new';
    });

    map.addEventListener('click', () => {
      const on = map.classList.toggle('set');
      mapLabel.textContent = on ? 'Точка сохранена' : 'Поставить точку на карте';
      map.setAttribute('aria-pressed', on ? 'true' : 'false');
    });

    const saved = {
      zarina: {
        fio: 'Хугаева Зарина Сослановна', birth: '1942', death: '2019',
        city: 'Владикавказ', cemetery: 'Городское кладбище',
        marks: 'Центральная аллея, третий ряд, ограда слева',
        life: 'Учительница. Любила сад и воскресные обеды с семьёй.',
        keep: 'Кусты у ограды и лампаду.'
      },
      soslan: {
        fio: 'Хугаев Сослан Батрович', birth: '1938', death: '2014',
        city: 'Владикавказ', cemetery: 'Городское кладбище',
        marks: 'Центральная аллея, третий ряд, ограда справа',
        life: 'Инженер. По субботам водил внуков в горы.',
        keep: 'Ограду не красить без согласования цвета.'
      }
    };
    const editId = new URLSearchParams(location.search).get('id');
    const current = saved[editId];
    if (current) {
      document.querySelector('.stage-label').textContent = 'Экран 6 · Правка';
      document.title = 'Помним — правка могилы';
      document.getElementById('title').textContent = 'Правка';
      document.getElementById('lead').textContent = 'Имя на плите, место и запреты увидит исполнитель. Фото человека останется у семьи.';
      document.getElementById('back').href = '05-mogila.html?id=' + editId;
      document.getElementById('back-label').textContent = 'Карточка';
      fio.value = current.fio;
      document.getElementById('birth').value = current.birth;
      document.getElementById('death').value = current.death;
      city.value = current.city;
      cemetery.value = current.cemetery;
      document.getElementById('marks').value = current.marks;
      document.getElementById('life').value = current.life;
      document.getElementById('keep').value = current.keep;
      family.value = 'hugaevy';
      map.classList.add('set');
      mapLabel.textContent = 'Точка сохранена';
      map.setAttribute('aria-pressed', 'true');
      refresh();
    }

    document.getElementById('grave-form').addEventListener('submit', (event) => {
      event.preventDefault();
      if (save.disabled) return;
      location.href = current ? '05-mogila.html?id=' + editId : '04-mogily.html';
    });
  </script>
</body>
</html>
